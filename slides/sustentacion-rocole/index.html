<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sustentación RoCoLe · Proyecto Café</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1e1c19;
      }
      hyperframes-slideshow,
      hyperframes-player {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <hyperframes-slideshow>
      <hyperframes-player src="./composition/index.html"></hyperframes-player>
    </hyperframes-slideshow>
    <p style="position:fixed;inset:auto 16px 16px 16px;color:#cfc8bc;font:16px/1.4 system-ui;max-width:42rem">
      Abre esta presentación con <code>npm run present</code> (o
      <code>npx hyperframes present ./composition</code>). Pulsa <strong>P</strong> para el modo
      presentador y la pestaña de audiencia.
    </p>
  </body>
</html>
